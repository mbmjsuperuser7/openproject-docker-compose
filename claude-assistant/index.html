<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenProject Assistant</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e8e8;
    --text2: #888;
    --text3: #555;
    --accent: #5b8ef0;
    --accent-bg: rgba(91,142,240,0.1);
    --success: #4caf84;
    --danger: #e05c5c;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo { 
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    background: var(--accent-bg); border: 1px solid rgba(91,142,240,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .header-title { font-size: 15px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text2); }

  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px; color: var(--text2);
    cursor: pointer; transition: border-color 0.2s;
  }
  .status-pill:hover { border-color: var(--border2); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
  .status-dot.on { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.err { background: var(--danger); }

  .config-panel {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: none;
  }
  .config-panel.open { display: block; }
  .config-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px;
    color: var(--text); font-size: 13px; width: 100%;
    transition: border-color 0.2s;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .btn {
    padding: 8px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: transparent;
    color: var(--text); font-size: 13px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #4a7de0; border-color: #4a7de0; color: #fff; }

  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; max-width: 820px; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.system { align-self: center; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .msg.assistant .avatar { background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(91,142,240,0.2); }
  .msg.user .avatar { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }

  .bubble {
    padding: 10px 14px; border-radius: var(--radius);
    font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .msg.user .bubble { background: var(--accent-bg); border: 1px solid rgba(91,142,240,0.2); color: var(--text); }
  .msg.system .bubble {
    background: transparent; border: 1px solid var(--border);
    color: var(--text2); font-size: 12px; text-align: center;
    border-radius: 20px; padding: 5px 14px;
  }

  .quick-actions {
    padding: 0 20px 12px;
    display: flex; flex-wrap: wrap; gap: 6px;
    flex-shrink: 0;
  }
  .qa { 
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text2); font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .qa:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  .input-area {
    padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
  }
  .input-area textarea {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px;
    color: var(--text); font-size: 13px; font-family: inherit;
    resize: none; min-height: 42px; max-height: 120px; line-height: 1.5;
    transition: border-color 0.2s;
  }
  .input-area textarea:focus { outline: none; border-color: var(--accent); }
  .input-area textarea:disabled { opacity: 0.4; }

  .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--text3);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,60%,100% { opacity: 0.3; transform: scale(1); } 30% { opacity: 1; transform: scale(1.3); } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">📋</div>
    <div>
      <div class="header-title">OpenProject Assistant</div>
      <div class="header-sub">AI-powered project management</div>
    </div>
  </div>
  <div class="status-pill" onclick="toggleConfig()" id="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Configure</span>
  </div>
</header>

<div class="config-panel" id="config-panel">
  <div class="config-grid">
    <div class="field">
      <label>OpenProject URL</label>
      <input type="text" id="op-url" placeholder="https://project.yourdomain.com" />
    </div>
    <div class="field">
      <label>API token</label>
      <input type="password" id="op-token" placeholder="opapi-..." />
    </div>
    <button class="btn primary" onclick="connect()" id="connect-btn">Connect</button>
  </div>
</div>

<div class="messages" id="messages">
  <div class="msg system"><div class="bubble">Click "Configure" in the top right to connect your OpenProject instance</div></div>
</div>

<div class="quick-actions" id="quick-actions" style="display:none">
  <button class="qa" onclick="ask('List all projects')">All projects</button>
  <button class="qa" onclick="ask('Show my open work packages')">My open tasks</button>
  <button class="qa" onclick="ask('Show work packages due this week')">Due this week</button>
  <button class="qa" onclick="ask('Show work packages by status summary')">Status summary</button>
  <button class="qa" onclick="ask('Create a new task')">New task</button>
  <button class="qa" onclick="ask('Show recent activity')">Recent activity</button>
</div>

<div class="input-area">
  <textarea id="chat-input" placeholder="Ask anything about your projects…" rows="1" disabled
    oninput="autoResize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
  <button class="btn primary" id="send-btn" onclick="send()" disabled>Send</button>
</div>

<script>
let connected = false, opUrl = '', opToken = '', history = [];

function toggleConfig() {
  document.getElementById('config-panel').classList.toggle('open');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function setStatus(ok, text) {
  connected = ok;
  document.getElementById('status-dot').className = 'status-dot ' + (ok ? 'on' : (text.includes('failed') || text.includes('error') ? 'err' : ''));
  document.getElementById('status-text').textContent = text;
}

async function connect() {
  const btn = document.getElementById('connect-btn');
  btn.disabled = true; btn.textContent = 'Connecting…';

  opUrl = document.getElementById('op-url').value.trim().replace(/\/$/, '');
  opToken = document.getElementById('op-token').value.trim();

  if (!opUrl || !opToken) {
    setStatus(false, 'URL and token required');
    btn.disabled = false; btn.textContent = 'Connect'; return;
  }

  localStorage.setItem('op_url', opUrl);
  localStorage.setItem('op_token', opToken);

  try {
    const resp = await fetch(opUrl + '/api/v3/users/me', {
      headers: { 'Authorization': 'Basic ' + btoa('apikey:' + opToken), 'Content-Type': 'application/json' }
    });
    if (resp.ok) {
      const user = await resp.json();
      setStatus(true, 'Connected as ' + user.name);
      document.getElementById('config-panel').classList.remove('open');
      document.getElementById('chat-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('quick-actions').style.display = 'flex';
      history = [];
      addMsg('assistant', `Connected as ${user.name}.\n\nI can help you manage your OpenProject — list projects, view and create work packages, update statuses, add comments. What would you like to do?`);
    } else {
      setStatus(false, 'Auth failed — check token');
    }
  } catch(e) {
    setStatus(false, 'Connection error');
  }

  btn.disabled = false; btn.textContent = 'Connect';
}

async function send() {
  const ta = document.getElementById('chat-input');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  addMsg('user', text);
  showTyping();
  history.push({ role: 'user', content: text });

  try {
    const systemPrompt = `You are an AI assistant integrated into OpenProject running at ${opUrl}.
You have direct access to the OpenProject REST API v3. The user is already authenticated.

To make API calls, prefix your request with [API_CALL] followed by the method and path, like:
[API_CALL] GET /api/v3/projects
[API_CALL] GET /api/v3/work_packages?filters=[{"status":{"operator":"o","values":[]}}]
[API_CALL] POST /api/v3/projects/1/work_packages {"subject":"New task","description":{"raw":"Details"}}

The frontend will intercept these, make the actual API calls with the stored auth token, and return results to you.

When the user asks to list/show something, make the API call. When they ask to create/update, confirm details first then make the call.
Format responses clearly. For lists, show ID, title, status. Be concise and helpful.`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await resp.json();
    let reply = data.content?.find(b => b.type === 'text')?.text || 'No response';

    if (reply.includes('[API_CALL]')) {
      reply = await handleApiCalls(reply);
    }

    removeTyping();
    addMsg('assistant', reply);
    history.push({ role: 'assistant', content: reply });
    if (history.length > 30) history = history.slice(-30);
  } catch(e) {
    removeTyping();
    addMsg('assistant', 'Error: ' + e.message);
  }
}

async function handleApiCalls(text) {
  const lines = text.split('\n');
  let result = '';

  for (const line of lines) {
    if (line.startsWith('[API_CALL]')) {
      const parts = line.replace('[API_CALL]', '').trim().split(' ');
      const method = parts[0];
      const path = parts[1];
      const body = parts.slice(2).join(' ') || null;

      try {
        const opts = {
          method,
          headers: { 'Authorization': 'Basic ' + btoa('apikey:' + opToken), 'Content-Type': 'application/json' }
        };
        if (body) opts.body = body;
        const r = await fetch(opUrl + path, opts);
        const d = await r.json();
        result += '\n[API_RESULT] ' + JSON.stringify(d).slice(0, 2000);
      } catch(e) {
        result += '\n[API_RESULT] Error: ' + e.message;
      }
    } else {
      result += '\n' + line;
    }
  }

  if (result.includes('[API_RESULT]')) {
    history.push({ role: 'assistant', content: text });
    history.push({ role: 'user', content: 'Here are the API results:' + result.split('[API_RESULT]').slice(1).join('\n') + '\n\nNow summarize this clearly for the user.' });

    const resp2 = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: history })
    });
    const d2 = await resp2.json();
    return d2.content?.find(b => b.type === 'text')?.text || result;
  }

  return result.trim();
}

function ask(text) {
  document.getElementById('chat-input').value = text;
  send();
}

function addMsg(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role !== 'system') {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'assistant' ? 'AI' : 'You';
    div.appendChild(av);
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  div.appendChild(b);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant'; div.id = 'typing';
  div.innerHTML = '<div class="avatar">AI</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

const saved_url = localStorage.getItem('op_url');
const saved_token = localStorage.getItem('op_token');
if (saved_url) document.getElementById('op-url').value = saved_url;
if (saved_token) document.getElementById('op-token').value = saved_token;
if (saved_url && saved_token) {
  document.getElementById('config-panel').classList.add('open');
}
</script>
</body>
</html>
